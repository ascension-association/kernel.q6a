# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json
header:
  version: 14
  includes:
  - repo: meta-qcom
    file: ci/base.yml
  - repo: meta-qcom
    file: ci/qcom-distro.yml
  - repo: meta-qcom
    file: ci/linux-qcom-next.yml
  - repo: meta-qcom
    file: ci/base.lock.yml
machine: radxa-dragon-q6a
repos:
  meta-qcom:
    path: meta-qcom
  meta-radxa-bsp:
    path: meta-radxa-bsp
local_conf_header:
  parallelism: |
    BB_PRESSURE_MAX_MEMORY = "15000"
    PARALLEL_MAKE = "-j 4"
    do_compile[number_threads] = "8"
    do_configure[number_threads] = "8"
